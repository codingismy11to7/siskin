<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Background lives on html, not body. body is width-constrained, so a
   background set there only paints the text column and leaves the rest of
   the viewport at the browser default -- which reads as a narrow dark card
   floating in a white page under a dark colour scheme. */
html{background:#fdfdfc}
body{max-width:44rem;margin:0 auto;padding:3.5rem 1.5rem 6rem;
     font:16px/1.7 system-ui,-apple-system,"Segoe UI",sans-serif;
     color:#23221f;background:transparent}
h1{font-size:2rem;line-height:1.2;margin:0 0 .5rem;letter-spacing:-.01em}
h1+p{margin-top:0;color:#6b6862}
h2{font-size:1.1rem;margin:2.75rem 0 .75rem;letter-spacing:.01em;
   text-transform:uppercase;color:#6b6862;font-weight:600}
p,li{margin:.75rem 0}
ul{padding-left:1.25rem}
table{border-collapse:collapse;width:100%;margin:1rem 0;font-size:.95rem}
th,td{text-align:left;padding:.55rem .7rem;border-bottom:1px solid #e6e4df;vertical-align:top}
th{font-weight:600;color:#6b6862}
a{color:#0b64c8;text-underline-offset:2px}
hr{border:0;border-top:1px solid #e6e4df;margin:2.5rem 0}
@media(prefers-color-scheme:dark){
  html{background:#141413}
  body{color:#e4e2dd}
  h1+p,h2,th{color:#a3a099}
  th,td{border-color:#2e2d2a}
  a{color:#8ab4f8}
  hr{border-color:#2e2d2a}
}
</style>
