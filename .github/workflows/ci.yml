name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before the JDK and Gradle, so a broken cut fails in seconds. The script
      # edits text only, which is why it needs neither.
      - name: Test the release cut script
        run: scripts/test-cut-release.sh

      - name: Setup JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Cache Gradle and wrapper
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'gradle.properties', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # room.schemaLocation writes the exported schema into the *source* tree,
      # so the builds above regenerate app/schemas in the runner's workspace and
      # nothing compares it against what is committed. Changing an entity
      # without committing the regenerated JSON is therefore a green build.
      #
      # Most of the damage that could do is already caught earlier and louder:
      # AppDatabase deliberately has no fallbackToDestructiveMigration, so a
      # device holding a mismatched database throws on open, on the developer's
      # own device, the first time they run the change. What stays quiet is a
      # committed schema that has *drifted* -- present, so nothing errors on its
      # absence, but wrong, so the first real migration is generated against a
      # bad baseline.
      #
      # --porcelain rather than `git diff --exit-code`: a new version's JSON
      # arrives as an untracked file, which a diff does not see.
      - name: Check the exported Room schema is committed
        run: |
          changed=$(git status --porcelain -- app/schemas)
          if [ -n "$changed" ]; then
            echo "$changed"
            git diff -- app/schemas
            echo "::error::app/schemas does not match the entities. Run ./gradlew assembleDebug and commit what changes under app/schemas." >&2
            exit 1
          fi
          echo "app/schemas matches the entities."

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/

  # Its own job so the one above is what its name says, and so a style error
  # reports in about a minute rather than behind four minutes of tests and a
  # build it does not need. It compiles the sources again rather than inheriting
  # them -- Android lint needs them, and that is the price of the split.
  lint:
    name: Lint and Kotlin style
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Play caps "what's new" at 500 characters, and finding that out at
      # publish time means after the cut has merged. Counted over the whole
      # file, trailing newline included -- the measure scripts/cut-release.sh
      # drafts to. Before Gradle, so it fails in seconds.
      - name: Check the Play release note fits
        run: |
          note=app/src/main/play/release-notes/en-US/default.txt
          if [ -z "$(tr -d '[:space:]' < "$note")" ]; then
            echo "::error file=$note::The release note is empty." >&2
            exit 1
          fi
          chars=$(LC_ALL=C.UTF-8 wc -m < "$note")
          if [ "$chars" -gt 500 ]; then
            echo "::error file=$note::The release note is $chars characters; Play allows 500." >&2
            exit 1
          fi
          echo "Release note: $chars of 500 characters."

      # The listing publishes from promote.yml, which is the last place to find
      # out a field is too long. GPP trims each file before uploading it, so the
      # trailing newline is not counted here.
      - name: Check the Play listing fits
        run: |
          dir=app/src/main/play/listings/en-US
          status=0
          for field in title:30 short-description:80 full-description:4000; do
            file="$dir/${field%%:*}.txt" limit="${field##*:}"
            text="$(cat "$file")"
            chars=$(printf %s "$text" | LC_ALL=C.UTF-8 wc -m)
            if [ "$chars" -gt "$limit" ]; then
              echo "::error file=$file::${field%%:*} is $chars characters; Play allows $limit." >&2
              status=1
            else
              echo "${field%%:*}: $chars of $limit characters."
            fi
          done
          exit $status

      - name: Setup JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Cache Gradle and wrapper
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'gradle.properties', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # `lint` rather than `lintDebug`: it is AGP's umbrella over lintDebug, and
      # app/build.gradle hangs ktlintCheck and spotlessCheck off it, so this one
      # word covers all three -- Android lint's correctness checks, ktlint's
      # Kotlin style and google-java-format's Java style. lintDebug sits
      # underneath and would run Android lint alone.
      #
      # The job *name* below is a required status check in ruleset 19853130, so
      # it is frozen rather than kept accurate: renaming it without editing the
      # ruleset in lockstep blocks every later PR on a check that never reports.
      #
      # Errors only -- see the lint block in app/build.gradle for why the
      # warnings are not fatal and why the four dependency-freshness checks are
      # off. The baseline this replaces was 9 errors that nothing ran, which is
      # the same failure mode as the warnings: a check nobody executes is not a
      # check.
      - name: Lint and Kotlin style
        run: ./gradlew lint

      # siskinapp.com/credits is built from the committed SBOM, and Workers
      # Builds cannot run Gradle to refresh it, so a dependency change that
      # does not regenerate it would leave the page describing an older app.
      # --porcelain for the same reason as the app/schemas check: a missing
      # file shows up as untracked, which a plain diff does not see. See
      # docs/decisions/2026-10-25-sbom-credits-design.md.
      - name: Check the open-source credits are current
        run: |
          ./gradlew ossCredits
          changed=$(git status --porcelain -- docs/web/sbom.cdx.json docs/web/credits-oss.html)
          if [ -n "$changed" ]; then
            echo "$changed"
            git diff --stat -- docs/web
            echo "::error::The SBOM does not match the release classpath. Run ./gradlew ossCredits and commit docs/web/sbom.cdx.json and docs/web/credits-oss.html." >&2
            exit 1
          fi
          echo "The open-source credits match the release classpath."

      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/ktlint/

  # Its own job for the same reasons `lint` is, above -- including that its
  # name is frozen once it joins ruleset 19853130's required checks.
  #
  # The emulator pins below must match flake.nix's emulatorSdkVersion,
  # systemImageType and abiVersion: same image, two declarations, and changing
  # one without the other makes local and CI test different things.
  emulator:
    name: Emulator smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Cache Gradle and wrapper
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'gradle.properties', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Without this the emulator falls back to software rendering and the job
      # goes from minutes to unusable.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Built before the emulator starts so a compile error fails in seconds
      # rather than behind a boot.
      - name: Build the app and test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      # No retry wrapper: flake has to be measured before it is mitigated. The
      # boot timeout stays at the action's 600s default -- measured cold path is
      # 93s -- and must stay well below timeout-minutes, or the job cap fires
      # first and the boot timeout's own diagnostic never surfaces.
      - name: Run the smoke test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 33
          target: android-automotive
          arch: x86_64
          profile: automotive_1024p_landscape
          force-avd-creation: false
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -no-snapshot-save -camera-back none -camera-front none
          emulator-boot-timeout: 600
          script: |
            ./gradlew installDebug installDebugAndroidTest
            ./scripts/emulator-smoke-test.sh

      # The script's EXIT trap screenshots on every run, pass or fail, and dumps
      # logcat.txt beside it on a failure, so a red run carries evidence too. No instrumentation-report step: this job drives
      # `am instrument` directly rather than connectedAndroidTest, so that
      # report directory is never written.
      - name: Upload emulator screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator-screenshots
          path: build/emulator-screenshots/
          if-no-files-found: warn
