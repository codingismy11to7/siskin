name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Cache Gradle and wrapper
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'gradle.properties', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # Errors only -- see the lint block in app/build.gradle for why the
      # warnings are not fatal and why the four dependency-freshness checks are
      # off. The baseline this replaces was 9 errors that nothing ran, which is
      # the same failure mode as the warnings: a check nobody executes is not a
      # check.
      - name: Lint
        run: ./gradlew lintDebug

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

      # room.schemaLocation writes the exported schema into the *source* tree,
      # so the builds above regenerate app/schemas in the runner's workspace and
      # nothing compares it against what is committed. Changing an entity
      # without committing the regenerated JSON is therefore a green build.
      #
      # Most of the damage that could do is already caught earlier and louder:
      # AppDatabase deliberately has no fallbackToDestructiveMigration, so a
      # device holding a mismatched database throws on open, on the developer's
      # own device, the first time they run the change. What stays quiet is a
      # committed schema that has *drifted* -- present, so nothing errors on its
      # absence, but wrong, so the first real migration is generated against a
      # bad baseline.
      #
      # --porcelain rather than `git diff --exit-code`: a new version's JSON
      # arrives as an untracked file, which a diff does not see.
      - name: Check the exported Room schema is committed
        run: |
          changed=$(git status --porcelain -- app/schemas)
          if [ -n "$changed" ]; then
            echo "$changed"
            git diff -- app/schemas
            echo "::error::app/schemas does not match the entities. Run ./gradlew assembleDebug and commit what changes under app/schemas." >&2
            exit 1
          fi
          echo "app/schemas matches the entities."

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
