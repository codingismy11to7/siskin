name: Promote to production

# Moves the build on automotive:internal to automotive:production without
# rebuilding it, so what ships is what ran in the car. Run it from the Actions
# tab with "Use workflow from" set to the release's tag. See
# docs/decisions/2026-10-21-release-automation-design.md.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  promote:
    name: Promote internal to production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # promoteArtifact promotes whatever internal holds, and every cut
      # publishes there, so the newest tag is what will actually be promoted.
      # Run against an older tag, this would quietly ship the newer build.
      - name: Check this is the newest release
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::Run this against a release tag (Use workflow from → Tags), not the branch $GITHUB_REF_NAME." >&2
            exit 1
          fi
          newest=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          if [ "$GITHUB_REF_NAME" != "$newest" ]; then
            echo "::error::$GITHUB_REF_NAME is not the newest release; automotive:internal holds $newest, and that is what would be promoted." >&2
            exit 1
          fi
          echo "Promoting $newest."

      - name: Setup JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Cache Gradle and wrapper
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'gradle.properties', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # No keystore: GPP 4.x registers its tasks for any non-debuggable
      # variant, signed or not, and a promotion uploads nothing to sign.
      - name: Promote
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: >-
          ./gradlew promoteArtifact
          --from-track automotive:internal
          --promote-track automotive:production
          --release-status completed

      # The listing is app-wide rather than per track, so it publishes here, when
      # the build it describes reaches everyone -- never from release.yml, which
      # would advertise a build only internal testers have. After the promotion,
      # so a failure here leaves the listing behind the build rather than ahead
      # of it.
      #
      # Only the text is in app/src/main/play/. Graphics stay manual uploads,
      # and GPP leaves alone any image type it has no directory for. See
      # docs/decisions/2026-10-25-play-listing-in-repo-design.md.
      - name: Publish the store listing
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: ./gradlew publishListing
