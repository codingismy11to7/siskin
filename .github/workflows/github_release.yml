name: Github Release Workflow

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-dev') }}
    steps:
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache Gradle and wrapper
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: bash ./gradlew testDebugUnitTest

      - name: Build Release APKs
        id: build
        run: |
          sed -ri '/org.gradle.toolchains.foojay-resolver-convention/d' settings.gradle
          bash ./gradlew assembleRelease

      - name: Sign Release APKs
        id: sign_release
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS_GITHUB }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD_GITHUB }}
        env:
          BUILD_TOOLS_VERSION: "36.0.0"

      - name: Rename Signed APKs to match local pattern
        run: |
          for file in app/build/outputs/apk/release/*-signed.apk; do
            new_name=$(echo "$file" | sed 's/-unsigned-signed\.apk$/.apk/' | sed 's/-signed\.apk$/.apk/')
            mv "$file" "$new_name"
          done

      - name: Rename Mapping File
        run: |
          mv -v app/build/outputs/mapping/release/mapping.txt app/build/outputs/mapping/release/mapping_Siskin.txt

      - name: Compress Mapping File
        run: |
          gzip -v app/build/outputs/mapping/release/mapping_Siskin.txt

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          prerelease: false
          files: |
            app/build/outputs/apk/release/*-release.apk
            app/build/outputs/mapping/release/mapping_Siskin.txt.gz
