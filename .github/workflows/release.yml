name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish to Play
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # A tag must name the version the build actually claims -- a tag that
      # disagrees with its own artifact should never ship.
      #
      # It also makes a bulk tag push harmless. The ~100 inherited tempo/tempus
      # tags (v3.x, v4.x) that came with the fork's history have been deleted
      # and were never on origin, but re-fetching from upstream would bring
      # them back, and each would otherwise fire a parallel publish of the same
      # versionCode.
      - name: Check the tag matches versionName
        if: github.event_name == 'push'
        run: |
          version_name=$(grep -oP "versionName\s+'\K[^']+" app/build.gradle)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version_name" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match versionName ${version_name}" >&2
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches versionName ${version_name}"

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Cache Gradle and wrapper
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'gradle.properties', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # Gradle needs the keystore as a real file, so the base64 secret is
      # decoded into the runner's temp directory for the life of the job.
      - name: Materialise the upload keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          keystore="${RUNNER_TEMP}/siskin-upload-key.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          echo "path=$keystore" >> "$GITHUB_OUTPUT"

      - name: Publish bundle to Play
        env:
          SISKIN_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          SISKIN_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SISKIN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SISKIN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: ./gradlew publishBundle

      - name: Remove the keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/siskin-upload-key.jks"
