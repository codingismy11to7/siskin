name: Release

# A merged cut changes app/version.properties, and that is what publishes. The
# tag is created afterwards, so a tag always means "this reached internal" and a
# failed publish leaves nothing to clean up: re-run this workflow. See
# docs/decisions/2026-10-21-release-automation-design.md.
on:
  push:
    branches: [main]
    paths: ['app/version.properties']
  workflow_dispatch:

permissions:
  contents: read

# Shared with promote.yml, so a promotion never races a publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish to Play
    # workflow_dispatch can name any branch; only main publishes.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Skips a version that already has its tag, which is every push that
      # touches the file without bumping it -- including the one that created
      # it. Refuses one that does not sort above the newest tag. Names rather
      # than versionCodes, because the 0.99.x tags predate the formula: 0.99.8
      # shipped as code 10, not 9908.
      - name: Decide whether this version ships
        id: version
        run: |
          name=$(sed -n 's/^versionName=//p' app/version.properties)
          tag="v$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse --quiet --verify "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists, so $name has shipped. Nothing to publish."
            echo "ship=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          newest=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "${newest#v}" "$name" | sort -V | tail -n 1)" != "$name" ]; then
            echo "::error::versionName $name does not sort above the newest tag $newest" >&2
            exit 1
          fi
          echo "Publishing $name (newest tag so far: ${newest:-none})."
          echo "ship=true" >> "$GITHUB_OUTPUT"

      - name: Setup JDK 21
        if: steps.version.outputs.ship == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Cache Gradle and wrapper
        if: steps.version.outputs.ship == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'gradle.properties', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run unit tests
        if: steps.version.outputs.ship == 'true'
        run: ./gradlew testDebugUnitTest

      # Gradle needs the keystore as a real file, so the base64 secret is
      # decoded into the runner's temp directory for the life of the job.
      - name: Materialise the upload keystore
        if: steps.version.outputs.ship == 'true'
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          keystore="${RUNNER_TEMP}/siskin-upload-key.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          echo "path=$keystore" >> "$GITHUB_OUTPUT"

      - name: Publish bundle to Play
        if: steps.version.outputs.ship == 'true'
        env:
          SISKIN_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          SISKIN_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SISKIN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SISKIN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: ./gradlew publishBundle

      - name: Remove the keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/siskin-upload-key.jks"

      # GITHUB_TOKEN pushes cannot start other workflows, which is fine:
      # nothing is meant to fire from a tag any more.
      - name: Tag the published version
        if: steps.version.outputs.ship == 'true'
        env:
          NAME: ${{ steps.version.outputs.name }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$TAG" -m "Siskin $NAME" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
