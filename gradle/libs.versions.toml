[versions]
agp = "9.3.2"
kotlin = "2.4.10"
play-publisher = "4.1.1"

# Keep equal to flake.nix's pkgs.ktlint -- the editor lints from the dev shell
# and the build lints from here, and two ktlints that disagree about the same
# file is the failure mode this pin exists to prevent.
ktlint = "1.8.0"
ktlintGradle = "14.2.0"

# Keep equal to flake.nix's pkgs.google-java-format -- the editor and the Claude
# write hook format from the dev shell and the build formats from here, and two
# formatters that disagree about the same file is the failure mode this pin
# exists to prevent.
googleJavaFormat = "1.35.0"
spotless = "7.0.4"

# AndroidX / Material
activity = "1.13.0"
constraintlayout = "2.2.2"
coreKtx = "1.19.0"
room = "2.8.4"
appcompat = "1.8.0"
material = "1.14.0"
recyclerview = "1.4.0"

# Third-party
glide = "4.16.0"
media3 = "1.11.0"
# The "+1" is a build suffix, not a Gradle wildcard -- only a version *ending*
# in "+" is dynamic. Google publishes no ffmpeg artifact of its own; see
# docs/decisions/2026-08-21-ffmpeg-decoder-design.md.
jellyfinFfmpegDecoder = "1.9.0+1"
retrofit = "3.0.0"
okhttpLogging = "5.5.0"
arrow = "2.2.3"
coroutines = "1.11.0"
lifecycle = "2.9.4"
robolectric = "4.16.1"

[libraries]
androidx-activity = { group = "androidx.activity", name="activity", version.ref = "activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }

material = { group = "com.google.android.material", name = "material", version.ref = "material" }

glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }
glide-annotations = { group = "com.github.bumptech.glide", name = "annotations", version.ref = "glide" }
glide-compiler = { group = "com.github.bumptech.glide", name = "compiler", version.ref = "glide" }

media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
media3-inspector = { group = "androidx.media3", name = "media3-inspector", version.ref = "media3" }
jellyfin-ffmpeg-decoder = { group = "org.jellyfin.media3", name = "media3-ffmpeg-decoder", version.ref = "jellyfinFfmpegDecoder" }

retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttpLogging" }

kotlin-metadata = { group = "org.jetbrains.kotlin", name = "kotlin-metadata-jvm", version.ref = "kotlin" }

arrow-core = { group = "io.arrow-kt", name = "arrow-core", version.ref = "arrow" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }

# Test-only
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttpLogging" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
play-publisher = { id = "com.github.triplet.play", version.ref = "play-publisher" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }