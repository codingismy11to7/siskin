// Release signing is driven entirely by the environment so that one code path
// serves both call sites: CI injects these from repository secrets, and locally
// `sops exec-env` supplies them for the life of a single command without ever
// writing plaintext to disk.
//
// Their absence is deliberately not an error. A fresh clone, CI's test job, and
// `assembleDebug` all have to keep working with none of this set -- so the
// signingConfig is only created, and only referenced, when all four are present.
//
// SISKIN_KEYSTORE_PATH is a path rather than the key material because Gradle
// needs the keystore as a real file and an environment variable cannot be one.
def siskinSigningEnv = [
        'SISKIN_KEYSTORE_PATH',
        'SISKIN_KEYSTORE_PASSWORD',
        'SISKIN_KEY_ALIAS',
        'SISKIN_KEY_PASSWORD',
].collectEntries { [(it): System.getenv(it)] }
def siskinSigningConfigured = siskinSigningEnv.values().every { it }

android {
    namespace = 'com.cappielloantonio.tempo'
    //noinspection GradleDependency
    compileSdk = 36
    buildToolsVersion = '36.0.0'

    defaultConfig {
        applicationId = 'us.codingismy11to7.siskin'
        minSdkVersion 28
        //noinspection OldTargetApi
        targetSdk = 36

        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.schemaLocation": "$projectDir/schemas".toString(),
                        "room.incremental"   : "true"
                ]
            }
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
    }

    splits {
        abi {
            enable = true
            reset()
            //noinspection ChromeOsAbiSupport
            universalApk = true
        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs (for IzzyOnDroid/F-Droid)
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles (for Google Play)
        includeInBundle = false
    }

    signingConfigs {
        if (siskinSigningConfigured) {
            release {
                storeFile = file(siskinSigningEnv.SISKIN_KEYSTORE_PATH)
                storePassword = siskinSigningEnv.SISKIN_KEYSTORE_PASSWORD
                keyAlias = siskinSigningEnv.SISKIN_KEY_ALIAS
                keyPassword = siskinSigningEnv.SISKIN_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            shrinkResources = true
            minifyEnabled = true
            debuggable = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (siskinSigningConfigured) {
                signingConfig = signingConfigs.release
            }
        }

        debug {
            applicationIdSuffix = ".debug"
            debuggable = true
        }
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
}

// Uploads go to the internal track as a DRAFT, which needs a manual
// confirmation in the Play Console before testers see it.
//
// The draft is deliberately temporary. The point of the first several releases
// is to watch what the pipeline actually does at each step, and a draft leaves
// a checkpoint where that is visible. Once this is boring it should publish
// straight to internal -- a draft that always gets confirmed is just a manual
// step wearing a costume.
//
// Credentials come from ANDROID_PUBLISHER_CREDENTIALS in the environment
// rather than a JSON file on disk, for the same reason as the signing config.
play {
    track.set('internal')
    releaseStatus.set(com.github.triplet.gradle.androidpublisher.ReleaseStatus.DRAFT)
}

// Room is what pins this, and upgrading Room does not release it. This
// project is on room-compiler 2.7.0 (libs.versions.toml), but *every*
// release up to and including 2.8.4 -- the newest published as of July 2026
// -- bundles kotlin-metadata-jvm 2.2.0, which reads metadata format 2.2.0 at
// most. This project compiles with a newer Kotlin (see libs.versions.toml),
// so without this force compileDebugJavaWithJavac fails on every
// annotation-processed file with:
//
//   Provided Metadata instance has version 2.4.0, while maximum supported
//   version is 2.2.0. To support newer versions, update the kotlin-metadata-jvm
//   library.
//
// Forcing a metadata *reader* forward like this is safe -- a newer reader
// still understands older metadata formats -- which is the opposite of
// forcing a stdlib *backward*, e.g. to satisfy some other dependency's
// version floor: that pins a library beneath the version it was compiled
// against and compiles fine, then fails at runtime with NoSuchMethodError.
// This project cannot bump Kotlin by version number alone for as long as
// Room's processor lags behind it; removing this force will silently
// re-break the build on the next Kotlin bump.
configurations.matching { it.name.toLowerCase().contains('annotationprocessor') }.configureEach {
    resolutionStrategy.force "org.jetbrains.kotlin:kotlin-metadata-jvm:${libs.versions.kotlin.get()}"
}

