plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.parcelize)
    alias(libs.plugins.play.publisher)
    alias(libs.plugins.ktlint)
    alias(libs.plugins.spotless)
    alias(libs.plugins.cyclonedx)
}

// Release signing is driven entirely by the environment so that one code path
// serves both call sites: CI injects these from repository secrets, and locally
// `sops exec-env` supplies them for the life of a single command without ever
// writing plaintext to disk.
//
// Their absence is deliberately not an error. A fresh clone, CI's test job, and
// `assembleDebug` all have to keep working with none of this set -- so the
// signingConfig is only created, and only referenced, when all four are present.
//
// SISKIN_KEYSTORE_PATH is a path rather than the key material because Gradle
// needs the keystore as a real file and an environment variable cannot be one.
def siskinSigningEnv = [
        'SISKIN_KEYSTORE_PATH',
        'SISKIN_KEYSTORE_PASSWORD',
        'SISKIN_KEY_ALIAS',
        'SISKIN_KEY_PASSWORD',
].collectEntries { [(it): System.getenv(it)] }
def siskinSigningConfigured = siskinSigningEnv.values().every { it }

def siskinApplicationId = 'us.codingismy11to7.siskin'

// The version is the one value in app/version.properties, which the release cut
// rewrites. versionCode is derived from it so the two cannot disagree, and the
// formula is permanent: Play refuses any code below one it has already seen.
// See docs/decisions/2026-10-21-release-automation-design.md.
def siskinVersionProps = new Properties()
siskinVersionProps.load(new StringReader(
        providers.fileContents(layout.projectDirectory.file('version.properties')).asText.get()))
def siskinVersionName = siskinVersionProps.getProperty('versionName') ?: ''
def siskinVersionMatch = siskinVersionName =~ /^(\d+)\.(\d+)\.(\d+)$/
if (!siskinVersionMatch.matches()) {
    throw new GradleException("versionName '${siskinVersionName}' in app/version.properties is not X.Y.Z")
}
def (siskinMajor, siskinMinor, siskinPatch) = (1..3).collect { siskinVersionMatch.group(it) as int }
if (siskinMinor > 99 || siskinPatch > 99) {
    throw new GradleException(
            "versionName '${siskinVersionName}': minor and patch must each be 99 or less, " +
                    "or its versionCode collides with a later release's")
}
def siskinVersionCode = siskinMajor * 10000 + siskinMinor * 100 + siskinPatch

android {
    namespace = 'com.cappielloantonio.tempo'
    //noinspection GradleDependency
    compileSdk = 37
    buildToolsVersion = '37.0.0'

    // android.car is an optional platform library: present in the compileSdk's
    // optional/ directory, absent from android.jar. It is *not* in the package
    // manager's shared-library registry on AAOS -- the classes come from the
    // BOOTCLASSPATH -- which is why the manifest's <uses-library> must stay
    // required="false". See the 2026-08-27 vehicle device name design.
    useLibrary 'android.car'

    defaultConfig {
        applicationId = siskinApplicationId
        minSdkVersion 28
        //noinspection OldTargetApi
        targetSdk = 36

        versionCode siskinVersionCode
        versionName siskinVersionName
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.schemaLocation": "$projectDir/schemas".toString(),
                        "room.incremental"   : "true"
                ]
            }
        }
    }

    // Without this the bundle inherits every locale its dependencies ship --
    // AndroidX, Material and media3 carry ~85 between them, which is what
    // made the Play listing claim 88 languages for an app with 41 strings. The
    // app's own res/ already holds exactly these five; the filter is what reaches
    // dependency resources. See the 2026-08-02 five locales design.
    androidResources {
        localeFilters += ["en", "de", "es", "fr", "it"]
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
        // Robolectric sets up every sandbox through jdk.internal.access, which
        // java.base does not export; without this every Robolectric test fails
        // with "Failed to interact with raw FileDescriptor internals".
        unitTests.all {
            jvmArgs '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED'
        }
    }

    // MigrationTestHelper reads the exported schemas as assets, and Robolectric only sees
    // the debug variant's merged assets -- a test source set is not merged for unit tests.
    // Costs the debug APK a few KB of JSON; release is untouched.
    sourceSets {
        debug.assets.srcDirs += files("$projectDir/schemas")
    }

    splits {
        abi {
            enable = true
            reset()
            //noinspection ChromeOsAbiSupport
            universalApk = true
        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs (for IzzyOnDroid/F-Droid)
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles (for Google Play)
        includeInBundle = false
    }

    signingConfigs {
        if (siskinSigningConfigured) {
            release {
                storeFile = file(siskinSigningEnv.SISKIN_KEYSTORE_PATH)
                storePassword = siskinSigningEnv.SISKIN_KEYSTORE_PASSWORD
                keyAlias = siskinSigningEnv.SISKIN_KEY_ALIAS
                keyPassword = siskinSigningEnv.SISKIN_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            shrinkResources = true
            minifyEnabled = true
            debuggable = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (siskinSigningConfigured) {
                signingConfig = signingConfigs.release
            }
            resValue "string", "plex_account_type", "${siskinApplicationId}.plex"
        }

        debug {
            applicationIdSuffix = ".debug"
            debuggable = true
            // res/xml is a resource, so it cannot read the ${applicationId} manifest
            // placeholder that AlbumArtContentProvider's authority uses. Generating
            // the string instead keeps debug and release from claiming one account
            // type, and keeps it out of strings.xml where it would trip
            // MissingTranslation.
            resValue "string", "plex_account_type", "${siskinApplicationId}.debug.plex"
        }
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
        // Off, the resValue calls above generate nothing at all -- silently, and
        // plex_account_type with them.
        resValues = true
    }

    // See docs/decisions/2026-08-13-build-hygiene-design.md.
    lint {
        abortOnError = true

        // The tree is at zero warnings, so this is what keeps it there. A
        // warning nobody is forced to read is scenery; see #99 for the sweep
        // that got here and what each suppression along the way cost.
        warningsAsErrors = true

        // Dependency-freshness checks: not facts about this repository.
        disable += [
            'NewerVersionAvailable',
            'GradleDependency',
            'UseTomlInstead',
            'AndroidGradlePluginVersion',
        ]
    }
}

// Covers test sources too. See docs/decisions/2026-08-13-build-hygiene-design.md.
kotlin {
    compilerOptions {
        allWarningsAsErrors = true
    }
}

// ktlintCheck reports, ktlintFormat rewrites. The version is pinned rather than
// left to the plugin's own default so it tracks flake.nix instead of the
// plugin's release schedule -- see the note in libs.versions.toml.
ktlint {
    version = libs.versions.ktlint.get()
}

// Spotless cannot read Android source sets, so the target is explicit rather
// than inferred. AOSP style because that is what the tree already is, and
// reorderImports because it defaults to false -- in which case imports are
// ordered as GOOGLE whatever the style says, and the gate rejects every file
// with grouped imports without explaining why. See the 2026-08-27
// google-java-format design.
spotless {
    java {
        target 'src/*/java/**/*.java'
        googleJavaFormat(libs.versions.googleJavaFormat.get()).aosp().reorderImports(true)
    }
}

// AGP's own `lint` and `lintFix` are thin umbrellas over lintDebug and
// lintFixDebug, so hanging the style checks off them makes one command cover
// every half: correctness from Android lint, Kotlin style from ktlint, Java
// style from google-java-format.
//
// CI runs `lint` rather than lintDebug for exactly this reason -- lintDebug sits
// *underneath* these and would run Android lint alone, picking up neither style
// check. See the comment above the lint step in .github/workflows/ci.yml.
tasks.named('lint') { dependsOn 'ktlintCheck' }
tasks.named('lintFix') { dependsOn 'ktlintFormat' }
tasks.named('lint') { dependsOn 'spotlessCheck' }
tasks.named('lintFix') { dependsOn 'spotlessApply' }

// The style-only half, named to mirror lint/lintFix. The plugin's own
// ktlintCheck/ktlintFormat still work and are what its documentation says.
tasks.register('ktlint') {
    group = 'verification'
    description = 'Runs ktlint on all Kotlin sources. The style half of `lint`.'
    dependsOn 'ktlintCheck'
}
tasks.register('ktlintFix') {
    group = 'formatting'
    description = 'Rewrites all Kotlin sources with ktlint. The style half of `lintFix`.'
    dependsOn 'ktlintFormat'
}

// The Java half of the same pair, named to mirror ktlint/ktlintFix so the two
// languages are addressable the same way. Spotless's own spotlessCheck and
// spotlessApply still work and are what its documentation says.
tasks.register('javafmt') {
    group = 'verification'
    description = 'Runs google-java-format on all Java sources. The style half of `lint`.'
    dependsOn 'spotlessCheck'
}
tasks.register('javafmtFix') {
    group = 'formatting'
    description = 'Rewrites all Java sources with google-java-format. The style half of `lintFix`.'
    dependsOn 'spotlessApply'
}

// The debug screen's Changelog tab shows Siskin's own sections of CHANGELOG.md,
// from [Unreleased] through [0.99.0], so the Tempus history below them never
// ships. Anchored on those two headings, which a release cut leaves in place;
// failing when either is missing beats shipping an empty or whole file. See
// docs/decisions/2026-10-25-changelog-tab-design.md.
abstract class TrimChangelog extends DefaultTask {
    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getChangelog()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void trim() {
        def lines = changelog.get().asFile.readLines('UTF-8')
        // Exactly the heading cut-release.sh looks for, so the two cannot
        // anchor on different lines.
        int start = lines.indexOf('## [Unreleased] — Siskin')
        int last = lines.findIndexOf { it.startsWith('## [0.99.0]') }
        if (start < 0 || last < start) {
            throw new GradleException('CHANGELOG.md needs a [Unreleased] heading above a [0.99.0] one')
        }
        int next = lines.findIndexOf(last + 1) { it.startsWith('## ') }
        def kept = lines.subList(start, next < 0 ? lines.size() : next)
        def out = outputDir.get().asFile
        out.deleteDir()
        out.mkdirs()
        new File(out, 'changelog.md').write(kept.join('\n'), 'UTF-8')
    }
}

def trimChangelog = tasks.register('trimChangelog', TrimChangelog) {
    changelog = rootProject.layout.projectDirectory.file('CHANGELOG.md')
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets?.addGeneratedSourceDirectory(trimChangelog) { it.outputDir }
    }
}

// siskinapp.com/credits lists every component the release APK ships. The
// plugin's SBOM is committed under docs/web/ without its serial number and
// timestamp, which change every run, so CI can check that it and the rendered
// table are current. See docs/decisions/2026-10-25-sbom-credits-design.md.
tasks.named('cyclonedxDirectBom') {
    includeConfigs = ['releaseRuntimeClasspath']
    includeBomSerialNumber = false
    includeBuildSystem = false
    componentGroup = 'us.codingismy11to7'
    componentName = 'siskin'
    xmlOutput.unsetConvention()
}

abstract class OssCredits extends DefaultTask {
    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getBom()

    @OutputFile
    abstract RegularFileProperty getSbom()

    @OutputFile
    abstract RegularFileProperty getTable()

    @TaskAction
    void render() {
        def doc = new groovy.json.JsonSlurper().parse(bom.get().asFile, 'UTF-8')
        doc.remove('serialNumber')
        doc.metadata?.remove('timestamp')
        doc.metadata?.component?.remove('externalReferences')
        sbom.get().asFile.write(
            groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(doc)) + '\n', 'UTF-8')

        def esc = { String s ->
            s.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;').replace('"', '&quot;')
        }
        def licence = { Map l ->
            if (l.id) return "<a href=\"https://spdx.org/licenses/${esc(l.id)}.html\">${esc(l.id)}</a>"
            if (l.url) return "<a href=\"${esc(l.url)}\">${esc(l.name ?: l.url)}</a>"
            return esc(l.name ?: l.expression ?: 'Unknown')
        }
        def rows = (doc.components ?: [])
            .sort(false) { a, b -> (a.group ?: '') <=> (b.group ?: '') ?: a.name <=> b.name }
            .collect { c ->
                def lics = (c.licenses ?: []).collect { it.license ? licence(it.license) : esc(it.expression ?: 'Unknown') }
                def vcs = (c.externalReferences ?: []).find { it.type == 'vcs' }?.url
                def name = c.group ? "${c.group}:${c.name}" : c.name
                [
                    '<tr>',
                    "<td>${esc(name).replace('.', '.<wbr>').replace(':', ':<wbr>')}</td>",
                    "<td>${esc(c.version ?: '')}</td>",
                    "<td>${lics ? lics.join(', ') : 'Not declared'}</td>",
                    "<td>${vcs ? "<a href=\"${esc(vcs)}\">Source</a>" : ''}</td>",
                    '</tr>',
                ].join('')
            }
        def out = [
            '<table class="oss">',
            '<thead><tr><th>Component</th><th>Version</th><th>License</th><th>Link</th></tr></thead>',
            '<tbody>',
            *rows,
            '</tbody>',
            '</table>',
        ]
        table.get().asFile.write(out.join('\n') + '\n', 'UTF-8')
    }
}

tasks.register('ossCredits', OssCredits) {
    group = 'documentation'
    description = 'Regenerates docs/web/sbom.cdx.json and credits-oss.html from the release classpath.'
    bom = tasks.named('cyclonedxDirectBom').flatMap { it.jsonOutput }
    sbom = rootProject.layout.projectDirectory.file('docs/web/sbom.cdx.json')
    table = rootProject.layout.projectDirectory.file('docs/web/credits-oss.html')
}

// javac's half of the same rule. -Werror alone is inert: without -Xlint, javac
// reports deprecated and unchecked use as a "Note:" rather than a warning, so
// there is nothing for it to catch. See the 2026-08-19 warnings-as-errors design.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:deprecation' << '-Xlint:unchecked' << '-Werror'
}

// Merging a release cut publishes straight to internal testing, with the
// "what's new" text from src/main/play/release-notes/; promote.yml later moves
// that same build to automotive:production. Credentials come from
// ANDROID_PUBLISHER_CREDENTIALS in the environment, as with the signing config.
// See docs/decisions/2026-07-31-play-release-pipeline-design.md and
// docs/decisions/2026-10-21-release-automation-design.md.
//
// The track is 'automotive:internal' and not 'internal'. Play gives each
// alternative form factor its own track family, and an artifact requiring
// android.hardware.type.automotive -- which this app's manifest does, as a hard
// requirement -- is refused by the plain tracks, which are the phone ones:
//
//   Artifact with version code 6 requires features that are not allowed on
//   this track: android.hardware.type.automotive.
//
// That refusal arrives when the edit is committed, which is why it stayed
// invisible for four releases. A DRAFT release is never live on its track and so
// is never validated against it, and 0.99.0 through 0.99.3 all landed here as
// drafts on 'internal' and were moved onto the automotive track by hand in the
// Console. That is what the "confirm the draft" step was really doing.
//
// GPP resolves release notes as <track>.txt falling back to default.txt, so the
// colon in the track name costs nothing here -- default.txt is what exists.
play {
    track.set('automotive:internal')
    releaseStatus.set(com.github.triplet.gradle.androidpublisher.ReleaseStatus.COMPLETED)
}

// room-compiler bundles a kotlin-metadata-jvm older than this project's
// Kotlin, and without this force compileDebugJavaWithJavac fails on every
// annotation-processed file with "Provided Metadata instance has version X,
// while maximum supported version is Y". Forcing a metadata *reader* forward
// is safe; do not delete this when bumping Kotlin or Room. See the 2026-07-28
// arrow-typed-errors design.
configurations.matching { it.name.toLowerCase().contains('annotationprocessor') }.configureEach {
    resolutionStrategy.force "org.jetbrains.kotlin:kotlin-metadata-jvm:${libs.versions.kotlin.get()}"
}

// Android lint runs from its own classpath, which the root buildscript's
// constraints do not reach, and it carries the same AGP-era bouncycastle and
// commons-lang3. Same constraints, same deletion rule -- see the root
// build.gradle.
dependencies {
    constraints {
        androidLintTool libs.bouncycastle.bcprov
        androidLintTool libs.bouncycastle.bcpkix
        androidLintTool libs.bouncycastle.bcutil
        androidLintTool libs.commons.lang3
    }
}

dependencies {
    // AndroidX
    implementation libs.androidx.activity
    implementation libs.androidx.constraintlayout
    // Declared rather than leaned on transitively: the KTX extensions are used
    // from source, so this must not rest on whichever library happens to pull
    // core-ktx in.
    implementation libs.androidx.core.ktx
    implementation libs.androidx.room.runtime
    implementation libs.androidx.appcompat
    // Declared rather than leaned on transitively: Material pulls RecyclerView
    // in, but a dependency Material could drop is not one to build a screen on.
    // Used only by BrowseTabOrderFragment, for ItemTouchHelper's drag and its
    // auto-scroll. See the customizable-browse-tabs design doc.
    implementation libs.androidx.recyclerview

    // Android Material
    implementation libs.material

    // Coil. coil-core rather than coil, which adds a process-wide default
    // ImageLoader with its own disk cache that nothing here should reach.
    implementation libs.coil.core
    implementation libs.coil.network.okhttp

    // Media3
    implementation libs.media3.session
    implementation libs.media3.common
    implementation libs.media3.exoplayer
    implementation libs.media3.exoplayer.hls
    implementation libs.media3.inspector
    // No source names this -- DefaultRenderersFactory loads it reflectively --
    // so removing it as unused breaks playback without failing the build.
    implementation libs.jellyfin.ffmpeg.decoder

    // Room Compiler
    annotationProcessor libs.androidx.room.compiler

    // Retrofit
    implementation libs.retrofit
    implementation libs.retrofit.converter.gson
    implementation libs.okhttp.logging

    // Coroutines
    implementation libs.kotlinx.coroutines.android
    implementation libs.androidx.lifecycle.viewmodel.ktx

    // Arrow
    implementation libs.arrow.core

    // Misc
    implementation libs.kotlin.metadata

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:6.4.0'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.okhttp.mockwebserver
    testImplementation libs.robolectric
    testImplementation libs.androidx.room.testing
    // Decodes the checked-in QR drawables; the app itself draws none at runtime.
    testImplementation libs.zxing.core

    // The instrumented tier. media3-session, Guava and Constants come from the
    // app's own `implementation` deps -- androidTest compiles against the
    // tested variant, so they need no second declaration here.
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.core

}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}